[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blurb-gen"
version = "1.0.0"
description = "Generates merchant-facing decision blurbs from versioned templates, then scores and gates them before they are marked ready to send"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
bedrock = ["boto3>=1.34"]
vertex = ["google-cloud-aiplatform>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[project.scripts]
blurb-gen = "blurb_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blurb_gen"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
