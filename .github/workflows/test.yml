name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,bedrock,vertex,excel]"

      - name: Lint
        run: ruff check src tests

      - name: Validate shipped templates
        run: blurb-gen templates --validate

      - name: Test
        run: pytest -q --cov=blurb_gen --cov-report=term-missing
